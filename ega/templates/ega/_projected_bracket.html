{% load i18n %}

{% if projected_bracket %}
<div class="section">
    <h3 class="title">{% trans 'Cuadro proyectado' %}</h3>
    <div class="row">
    {% for match in projected_bracket %}
        <div class="col-sm-6 col-md-4">
            <p>
                <small class="text-muted">#{{ match.match }}</small><br/>
                <strong>{% firstof match.home.code match.home %}</strong>
                <span class="text-muted">vs</span>
                <strong>{% firstof match.away.code match.away %}</strong>
            </p>
        </div>
    {% endfor %}
    </div>
</div>
{% endif %}
